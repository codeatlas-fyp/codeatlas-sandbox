[project]
name = "codeatlas-sandbox"
version = "0.1.0"
description = "Toy library-management app used as the target codebase for CodeAtlas scenario PRs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["payments"]
include = ["books.py", "loans.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
